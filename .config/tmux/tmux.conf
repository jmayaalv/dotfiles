set-option -g default-terminal 'tmux-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'
set -ag terminal-overrides ',*:RGB'          # omarchy: truecolor everywhere

# bindings
# Reload Config
unbind r
bind-key R source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

bind-key X confirm-before -p 'kill-session? (y/n)' kill-session



# set emacs keys
set -g status-keys emacs
setw -g mode-keys emacs
bind-key -T copy-mode C-w send -X copy-selection-and-cancel


# focus events enabled for terminals that support them
set -g focus-events on

# easier and faster switching between next/prev window
bind C-p previous-window
bind C-n next-window

bind-key N command-prompt -p "command:" 'run-shell "zsh -lic \"%%\""'

bind h split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"  # omarchy: new window inherits cwd

# omarchy: keybinding cheatsheet (upstream shells out to a Linux-only menu).
# Prefix table only: list-keys with no table dumps root + copy-mode + copy-mode-vi
# too, which is 327 lines of mostly mouse menus. -S stops long lines wrapping.
bind ? display-popup -E -w 80% -h 70% -T ' tmux keybindings (prefix) ' \
  'tmux list-keys -T prefix | sed "s/^bind-key  *-T prefix  *//" | sort | less -RS'

# Rename in a centered popup. The built-in command-prompt draws at column 0 of
# the status line, which with this theme is nowhere near the tab being renamed.
bind-key , display-popup -E -w 40 -h 3 -T ' rename window ' \
  'printf "Name: "; read -r n; [ -n "$n" ] && tmux rename-window "$n"'
bind-key '$' display-popup -E -w 40 -h 3 -T ' rename session ' \
  'printf "Name: "; read -r n; [ -n "$n" ] && tmux rename-session "$n"'

set -g mouse on
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # dont exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-interval 5         # omarchy: refresh the clock every 5s, not 15
setw -g pane-base-index 1        # omarchy: match base-index for panes
setw -g aggressive-resize on     # omarchy: size to the smallest attached client
set -g allow-passthrough on      # omarchy: let apps emit OSC through tmux
set -g extended-keys on          # omarchy: report C-S-<key> etc. to apps
set -g extended-keys-format csi-u

# omarchy: name windows after their directory, so most renaming is unnecessary.
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'

set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

# Title line on each pane border; the active pane's is magenta and bold so it is
# obvious which pane has focus. Colours are set in the format itself rather than
# inherited from the border style, so this does not depend on that behaviour.
set -g pane-border-format '#{?pane_active,#[fg=magenta#,bold],#[fg=brightblack]} #P #{pane_current_command} '
# Only spend a row on the title line when the window actually has >1 pane.
set-hook -g window-layout-changed 'if -F "#{==:#{window_panes},1}" "setw pane-border-status off" "setw pane-border-status top"'

set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
#set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
#set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'omerxx/catppuccin-tmux'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'Alkindi42/tmux-bitwarden'
set -g @bw-copy-to-clipboard 'on'


set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-bind 'p'
set -g @floax-change-path 'true'
set -g @sessionx-bind-zo-new-window 'ctrl-y'
set -g @sessionx-auto-accept 'off'
set -g @sessionx-bind 'o'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"
set -g @catppuccin_status_modules_right "directory date_time prefix"
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{b:pane_current_path}"
set -g @catppuccin_date_time_text "%H:%M"

# rebind prefix based on machine
if-shell "hostname | grep -qi mac-mini" \
  "set -g prefix C-t; unbind C-s; bind C-t send-prefix" \
  "set -g prefix C-s; unbind C-b; bind C-s send-prefix"

# status bar position per machine (mac-mini: bottom, mbp: top)
if-shell "hostname | grep -qi mac-mini" \
  "set -g status-position bottom" \
  "set -g status-position top"

# macOS specific settings
if-shell "uname | grep -q Darwin" \
  "source-file ~/.config/tmux/tmux.mac"

if-shell "uname | grep -q Linux" \
  "source-file ~/.config/tmux/tmux.linux"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# --- overrides that must run AFTER tpm, because the plugin sets these ---

# Active window name: rosewater and bold on the bar background, no chip behind
# it. Catppuccin only highlights via `fill`, and all its `fill` modes work by
# giving the tab a background, so this format is catppuccin's own "number" output
# with just the #W colour token swapped -- copied from `show -gv`, not retyped,
# because the pill's rounded caps are U+E0B6/U+E0B4 and do not survive being
# transcribed. If you change @catppuccin_window_current_text, redo this string.
set -g window-status-current-format '#[fg=#1e1e2e,bg=#1e1e2e,nobold,nounderscore,noitalics]#[fg=#f5e0dc,bg=#1e1e2e,bold]#W#{?window_zoomed_flag,(),}#[fg=#fab387,bg=#1e1e2e,nobold,nounderscore,noitalics] █#[fg=#1e1e2e,bg=#fab387]#I#[fg=#fab387,bg=#1e1e2e] '

# Inactive tabs: catppuccin's own "number" output (copied from `show -gv`, same
# caveat as above, for @catppuccin_window_default_text) with the pill's blue
# swapped for red while a Claude Code session in that window waits on you, and
# you haven't looked yet. claude-waiting.sh sets/clears the @claude_waiting
# window option from Claude hooks (~/.claude/settings.json).
set -g window-status-format '#[fg=#313244,bg=#1e1e2e,nobold,nounderscore,noitalics]#[fg=#cdd6f4,bg=#313244]#W#[fg=#{?@claude_waiting,#f38ba8,#89b4fa},bg=#313244,nobold,nounderscore,noitalics] █#[fg=#313244,bg=#{?@claude_waiting,#f38ba8,#89b4fa}]#I#[fg=#{?@claude_waiting,#f38ba8,#89b4fa},bg=#1e1e2e] '

# Visiting a window counts as seeing its Claude, so drop the red mark.
# session-window-changed covers every way of switching windows;
# client-session-changed covers landing on one by switching sessions.
set-hook -g session-window-changed 'set -wu @claude_waiting'
set-hook -g client-session-changed 'set -wu @claude_waiting'
