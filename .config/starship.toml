# Omarchy's prompt, from its config/starship.toml (github.com/basecamp/omarchy),
# plus $ahead_behind, which shows the ⇡/⇣/✓ it defines but leaves out, and ✦
# for suspended jobs. The branch and its status move to the right edge, after
# the last command's duration, the Java version in JVM projects and the
# Kubernetes context.
# zsh uses it while `omarchy-look on`; otherwise the prompt is oh-my-posh.

add_newline = true
command_timeout = 200
format = "[$directory]($style)$jobs$character"
right_format = "$cmd_duration$java$kubernetes$git_branch$git_status"

[character]
error_symbol = "[✗](bold cyan)"
success_symbol = "[❯](bold cyan)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$symbol$branch]($style) "
symbol = "\U000F062C "
style = "italic cyan"

[git_status]
format     = '[$all_status$ahead_behind]($style)'
style      = "cyan"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""

# Shown only after commands that ran 2s or more.
[cmd_duration]
format = "[took $duration]($style) "
style = "yellow"

# The java on PATH, i.e. sdkman's current. The defaults detect Clojure projects
# too (deps.edn, project.clj, .clj).
[java]
format = "[$symbol$version]($style) "
version_format = "${major}"
symbol = "\U000F0176 "
style = "cyan"

# The current context, everywhere: kubectl acts on it from any folder.
# Production (pdn-) in bold red. Aliases drop the usual -eu-central-1 and the
# EKS ARN prefix, so other regions still show.
[kubernetes]
disabled = false
format = '[$symbol$context( \($namespace\))]($style) '
symbol = "☸ "
style = "cyan"

[[kubernetes.contexts]]
context_pattern = '^(?:arn:aws:eks:[^:]+:\d+:cluster/)?(?P<name>pdn-.+?)(?:-eu-central-1)?$'
context_alias = "$name"
style = "bold red"

[[kubernetes.contexts]]
context_pattern = '^(?:arn:aws:eks:[^:]+:\d+:cluster/)?(?P<name>.+?)(?:-eu-central-1)?$'
context_alias = "$name"
