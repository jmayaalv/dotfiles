after-startup-command = [
  'exec-and-forget sketchybar',
  'exec-and-forget borders active_color=0xffc6a0f6 inactive_color=0xff494d64 width=5.0',
]

# Notify Sketchybar about workspace change.
# Everything after '-c' is a single bash command string; a second entry here
# would be passed as $0 to that script, not run as another command.
exec-on-workspace-change = ['/bin/bash', '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 300

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodness#disable-hide-app
automatically-unhide-macos-hidden-apps = false

# [[on-window-detected]]
# if.app-id = 'com.apple.systempreferences'
# if.app-name-regex-substring = 'settings'
# if.window-title-regex-substring = 'substring'
# if.workspace = 'workspace-name'
# if.during-aerospace-startup = true
# check-further-callbacks = true
# run = ['layout floating', 'move-node-to-workspace S']  # The callback itself

[[on-window-detected]]
if.window-title-regex-substring = 'AeroSpace Keybindings'
run = ['layout floating']

[[on-window-detected]]
if.app-name-regex-substring = 'telegram'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'finder'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'safari'
run = 'layout floating'
 
[[on-window-detected]]
if.app-name-regex-substring = 'mail'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'trello'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'quicktime'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'discord'
run = 'layout floating'

# Possible values: (qwerty|dvorak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See: https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
inner.horizontal = 10
inner.vertical   = 10
outer.left       = 8
outer.right      = 8
outer.bottom     = 8
outer.top        = 40   # clears the 35px sketchybar plus a little breathing room


# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}
[mode.main.binding]

# SUPER is Caps Lock, remapped by Karabiner to cmd+ctrl+alt (see
# .config/karabiner/karabiner.json). Shift stays free, which is what gives us
# the SUPER+SHIFT second level that Omarchy leans on. Nothing here uses a bare
# alt, so none of it collides with Emacs Meta.

# --- Windows ----------------------------------------------------------------
cmd-ctrl-alt-w = 'close'                                # SUPER+W  close window
cmd-ctrl-alt-t = 'layout floating tiling'               # SUPER+T  toggle float/tile
cmd-ctrl-alt-f = 'fullscreen'                           # SUPER+F  fullscreen
cmd-ctrl-alt-j = 'layout tiles horizontal vertical'     # SUPER+J  toggle split
cmd-ctrl-alt-comma = 'layout accordion horizontal vertical'  # accordion (not Omarchy)
cmd-ctrl-alt-k = 'exec-and-forget /bin/bash -c "$HOME/.config/aerospace/scripts/show-keybindings.sh"'  # SUPER+K  cheatsheet

# --- Focus ------------------------------------------------------------------
cmd-ctrl-alt-left  = 'focus left'
cmd-ctrl-alt-down  = 'focus down'
cmd-ctrl-alt-up    = 'focus up'
cmd-ctrl-alt-right = 'focus right'

# --- Move / swap windows ----------------------------------------------------
cmd-ctrl-alt-shift-left  = 'move left'
cmd-ctrl-alt-shift-down  = 'move down'
cmd-ctrl-alt-shift-up    = 'move up'
cmd-ctrl-alt-shift-right = 'move right'

# --- Resize -----------------------------------------------------------------
cmd-ctrl-alt-minus = 'resize width -100'                # SUPER+-  narrower
cmd-ctrl-alt-equal = 'resize width +100'                # SUPER+=  wider
cmd-ctrl-alt-shift-minus = 'resize height -100'         # SUPER+SHIFT+-  shorter
cmd-ctrl-alt-shift-equal = 'resize height +100'         # SUPER+SHIFT+=  taller

# --- Workspaces -------------------------------------------------------------
cmd-ctrl-alt-1 = 'workspace 1'
cmd-ctrl-alt-2 = 'workspace 2'
cmd-ctrl-alt-3 = 'workspace 3'
cmd-ctrl-alt-4 = 'workspace 4'
cmd-ctrl-alt-5 = 'workspace 5'

cmd-ctrl-alt-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
cmd-ctrl-alt-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
cmd-ctrl-alt-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
cmd-ctrl-alt-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
cmd-ctrl-alt-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'

cmd-ctrl-alt-tab = 'workspace next --wrap-around'       # SUPER+TAB        next
cmd-ctrl-alt-shift-tab = 'workspace prev --wrap-around' # SUPER+SHIFT+TAB  prev
cmd-ctrl-alt-backtick = 'workspace-back-and-forth'      # Omarchy's SUPER+CTRL+TAB is
                                                        # unreachable: ctrl is inside SUPER

# --- App launchers (Omarchy's SUPER+SHIFT+<letter> set) ----------------------
cmd-ctrl-alt-enter = 'exec-and-forget open -a /Applications/Alacritty.app'  # terminal
cmd-ctrl-alt-shift-enter = 'exec-and-forget open -a /Applications/Firefox.app'  # browser
cmd-ctrl-alt-shift-b = 'exec-and-forget open -a /Applications/Firefox.app'  # browser
cmd-ctrl-alt-shift-n = 'exec-and-forget open -a /Applications/Emacs.app'  # editor
cmd-ctrl-alt-shift-o = 'exec-and-forget open -a /Applications/Obsidian.app'  # Obsidian
cmd-ctrl-alt-shift-m = 'exec-and-forget open -a /Applications/Spotify.app'  # Spotify
cmd-ctrl-alt-shift-f = 'exec-and-forget open -a /System/Library/CoreServices/Finder.app'  # file manager
cmd-ctrl-alt-shift-a = 'exec-and-forget open -a /Applications/Claude.app'  # AI
cmd-ctrl-alt-shift-s = 'exec-and-forget open -a /Applications/Slack.app'  # Slack
cmd-ctrl-alt-shift-g = 'exec-and-forget open -a /Applications/WhatsApp.app'  # WhatsApp
cmd-ctrl-alt-shift-t = 'exec-and-forget open -a /Applications/Telegram.app'  # Telegram
cmd-ctrl-alt-shift-e = 'exec-and-forget open -a /System/Applications/Mail.app'  # email
cmd-ctrl-alt-shift-c = 'exec-and-forget open -a /System/Applications/Calendar.app'  # calendar
cmd-ctrl-alt-shift-slash = 'exec-and-forget open -a /Applications/Bitwarden.app'  # passwords

# --- Modes ------------------------------------------------------------------
cmd-ctrl-alt-shift-semicolon = 'mode service'

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
backspace = ['close-all-windows-but-current', 'mode main']
