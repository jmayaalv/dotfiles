[bell]
animation = "EaseOutExpo"
duration = 0

[cursor]
blink_interval = 500
blink_timeout = 5
unfocused_hollow = false

[cursor.style]
blinking = "Off"
shape = "Block"

[env]
TERM = "xterm-256color"

[font]
size = 12

[font.glyph_offset]
x = 0
y = 0

[font.offset]
x = 0
y = 0

[mouse]
hide_when_typing = true

[[mouse.bindings]]
action = "PasteSelection"
mouse = "Middle"

[selection]
save_to_clipboard = true

[[keyboard.bindings]]
key = "c"
mods = "Command"
action = "Copy"

[[keyboard.bindings]]
key = "v"
mods = "Command"
action = "Paste"

[[keyboard.bindings]]
key = "w"
mods = "Command"
chars = "\u0017"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\n"

# Super keys for terminal Emacs: in Alacritty, Karabiner turns the right Option
# key into Command, which reaches Emacs (kkp) as Super, as in GUI Emacs. These
# default Command shortcuts would swallow s-f, s-b, s-k and s-m, so they go to
# the program instead (no Alacritty search, clear or minimize). ⌘= ⌘- ⌘0 keep
# changing the font size: terminal Emacs can't scale text itself.
[[keyboard.bindings]]
key = "f"
mods = "Command"
action = "ReceiveChar"

[[keyboard.bindings]]
key = "b"
mods = "Command"
action = "ReceiveChar"

[[keyboard.bindings]]
key = "k"
mods = "Command"
action = "ReceiveChar"

[[keyboard.bindings]]
key = "m"
mods = "Command"
action = "ReceiveChar"

# Ctrl+Command+F is C-M-f (forward-sexp) in Emacs, not full screen.
[[keyboard.bindings]]
key = "f"
mods = "Command|Control"
action = "ReceiveChar"

[terminal.shell]
program = "/bin/zsh"


[window]
dynamic_title = true
startup_mode = "Maximized"
# Option is Alt/Meta. While Alacritty is in front, Karabiner sends left Command
# chords (except ⌘Tab, ⌘Space, ⌘` and screenshots) as left Option, so left
# Command is Meta as in GUI Emacs, and turns the right Option into Command,
# which programs see as Super. The right Command keeps the Alacritty/macOS
# shortcuts (copy, paste, quit, new window). The broken left Option is disabled.
option_as_alt = "Both"


[window.dimensions]
columns = 160
lines = 80


[general]
live_config_reload = true
# Colors, font family, padding and window frame live in one file under looks/.
# `omarchy-look on|off` rewrites this path; live reload repaints open windows.
import = ["~/.config/alacritty/looks/omarchy.toml"]
