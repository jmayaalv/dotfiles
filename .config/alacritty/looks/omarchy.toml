# Omarchy's terminal look: its default Tokyo Night theme and roomy padding. The
# colors are Omarchy's themes/tokyo-night/colors.toml run through its
# default/themed/alacritty.toml.tpl; the rest follows its
# config/alacritty/alacritty.toml (github.com/basecamp/omarchy), except the
# font: FiraCode stays in place of Omarchy's JetBrainsMono, at 12 rather than
# Omarchy's 9, which is sized for Hyprland's scaling.
# alacritty.toml imports one file from looks/; `omarchy-look on|off` picks it.

[colors.primary]
background = "#1a1b26"
foreground = "#a9b1d6"

[colors.cursor]
text = "#1a1b26"
cursor = "#c0caf5"

[colors.vi_mode_cursor]
text = "#1a1b26"
cursor = "#c0caf5"

[colors.search.matches]
foreground = "#1a1b26"
background = "#e0af68"

[colors.search.focused_match]
foreground = "#1a1b26"
background = "#f7768e"

[colors.footer_bar]
foreground = "#1a1b26"
background = "#a9b1d6"

[colors.selection]
text = "#c0caf5"
background = "#292e42"

[colors.normal]
black = "#1a1b26"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#ad8ee6"
cyan = "#449dab"
white = "#a9b1d6"

[colors.bright]
black = "#414868"
red = "#ff7a93"
green = "#b9f27c"
yellow = "#ff9e64"
blue = "#7da6ff"
magenta = "#bb9af7"
cyan = "#0db9d7"
white = "#c0caf5"

[font]
normal = { family = "FiraCode Nerd Font", style = "Regular" }
bold = { family = "FiraCode Nerd Font", style = "Bold" }
italic = { family = "FiraCode Nerd Font" }

# No title bar or border, as under Hyprland. A new window picks this up; one
# already open keeps its frame. Move or resize it with Raycast.
[window]
decorations = "None"

[window.padding]
x = 14
y = 14
