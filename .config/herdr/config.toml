onboarding = false

[keys]
prefix = "ctrl+s"

# Arrows move between panes, alongside the default h/j/k/l
focus_pane_left = ["prefix+h", "prefix+left"]
focus_pane_down = ["prefix+j", "prefix+down"]
focus_pane_up = ["prefix+k", "prefix+up"]
focus_pane_right = ["prefix+l", "prefix+right"]

# Jump straight to space 1-9 (prefix+1..9 still switches tabs)
switch_workspace = "prefix+shift+1..9"

# Jump straight to agent 1-9 in the agents list, across every connected machine
focus_agent = "prefix+ctrl+1..9"

# Previous/next space across every connected machine
previous_workspace = "prefix+shift+up"
next_workspace = "prefix+shift+down"

# herdr-file-viewer: git-aware tree with rendered markdown, diffs and code
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "open file viewer in split"

[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab"
description = "open file viewer in tab"

# hunk-diff: review changes in hunk, comment on lines, send the comments to the agent
[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review"
description = "hunk: review changes"

[[keys.command]]
key = "prefix+shift+s"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.send-review"
description = "hunk: send review comments to the agent"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review:staged"
description = "hunk: review staged changes"

[[keys.command]]
key = "prefix+shift+v"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review:commit"
description = "hunk: review the last commit"

# graphdiff: map of what the agent changed. Its README wants g / shift+g,
# which are herdr's goto and new-worktree.
[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "graphdiff.open"
description = "graphdiff: review changes in the browser"

[[keys.command]]
key = "prefix+shift+m"
type = "plugin_action"
command = "graphdiff.tui"
description = "graphdiff: map in the terminal"

# herdr-fingers: hint letters over paths, URLs, SHAs. Hint copies, Shift pastes,
# Ctrl opens, Alt opens in Emacs in a split (plugins/config/…herdr-fingers/).
# Its README wants f, which the file viewer already has.
[[keys.command]]
key = "prefix+y"
type = "plugin_action"
command = "nathan-poncet.herdr-fingers.start"
description = "fingers: copy, paste, open or edit a visible token"

# herdr-radar: flip the agents list between active and recent; settings
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "hhdebb.herdr-radar.view-flip"
description = "radar: agents active <-> recent"

[[keys.command]]
key = "prefix+comma"
type = "plugin_action"
command = "hhdebb.herdr-radar.settings"
description = "radar: settings"

# herdr-caffeinated: pause/resume keeping the Mac awake while agents work
[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "herdr-caffeinated.toggle"
description = "caffeinated: toggle pause"

# sqlit: jump to its own space, created with sqlit running on first use.
# Connections live in ~/.config/sqlit (Prod/QA/Local folders); Aurora ones
# fetch IAM tokens via bin/rds-token.
[[keys.command]]
key = "prefix+shift+q"
type = "shell"
command = "$HOME/.config/sqlit/bin/sqlit-space"
description = "sqlit space"

[ui.sound]
enabled = false

[ui.toast]
delivery = "herdr"

# >>> look: `omarchy-look on|off` writes this block from looks/<name>.toml
# Omarchy's herdr look, from its config/herdr/config.toml (github.com/basecamp/omarchy).
# herdr draws with the terminal's own palette, so it wears Alacritty's theme, with
# a blue accent and bare panes like tmux. Only the look comes over: Omarchy's
# keys and behaviour settings stay out.
# herdr has no imports, so `omarchy-look on|off` copies one file from looks/
# into the look block of config.toml. The block ends inside [ui]: a look puts
# its [ui] keys last, and config.toml's own [ui] keys follow.

[theme]
name = "terminal"

[theme.custom]
# The tab bar sits on the terminal's own background. With no panel_bg the active
# tab's text falls back to surface_dim: black text on the blue accent.
panel_bg = "reset"
surface_dim = "black"

[ui]
accent = "blue"
# Single-line dividers between panes, no outer frame, no scrollbar column.
pane_gaps = false
pane_outer_borders = false
pane_scrollbars = false
# <<< look

# >>> herdr-radar tab-bar block
tab_bar_right_separator = " · "
tab_bar_right = [
  { type = 'command', command = 'cat "/Users/jmayaalv/.local/state/herdr/plugins/hhdebb.herdr-radar/tabbar${HERDR_SESSION:+-$HERDR_SESSION}.txt"', interval_seconds = 6, timeout_seconds = 2 },
]
# <<< herdr-radar tab-bar block

status_indicators = "symbols"

