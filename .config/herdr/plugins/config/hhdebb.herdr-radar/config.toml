# Keep Radar's hands off [theme]: the Mocha theme and active-row colors in
# ~/.config/herdr/config.toml are tuned by hand.
follow_appearance = false

# Set from radar's settings screen (prefix then ,). "auto" uses the icon font
# when installed; if its logos render wrong in Alacritty, "text" is plain Unicode.
variant = "text"
reorder_workspaces = false
done_hold = "until_seen"
