# Keep Radar's hands off [theme]: the Mocha theme and active-row colors in
# ~/.config/herdr/config.toml are tuned by hand.
follow_appearance = false

# Vendor logos from the icon font; Ghostty maps their codepoints to it (the
# herdr-radar block in ghostty/config.ghostty). "text" is plain Unicode (§ for Claude).
variant = "font"
reorder_workspaces = false
done_hold = "until_seen"
# The other panes of a split tab hang off the first with a ├─ corner.
split_corner = true
